<svg xmlns="http://www.w3.org/2000/svg" width="700" height="790" font-family="system-ui,sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
