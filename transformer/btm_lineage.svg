  <line x1="269" y1="194" x2="350" y2="225" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 2"/>
  <line x1="410" y1="194" x2="350" y2="225" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 2"/>
  <line x1="551" y1="194" x2="350" y2="225" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 2"/>

