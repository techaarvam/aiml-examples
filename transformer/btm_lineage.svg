  <text x="269" y="183" text-anchor="middle" fill="#374151">epoch_4.txt</text>

  <rect x="344" y="146" width="133" height="48" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="410" y="166" text-anchor="middle" font-weight="600" fill="#166534">Branch C</text>
  <text x="410" y="183" text-anchor="middle" fill="#374151">epoch_5.txt</text>

  <rect x="485" y="146" width="133" height="48" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
