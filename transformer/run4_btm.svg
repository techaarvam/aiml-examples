  <!-- Output box -->
  <rect x="185" y="416" width="390" height="48" rx="6" fill="#0284c7"/>
  <text x="380" y="437" text-anchor="middle" font-size="13" font-weight="600" fill="white">btm_r2_interpolated.pth</text>
  <text x="380" y="455" text-anchor="middle" font-size="11" fill="#bae6fd">128M params · cl100k_base · w128</text>

