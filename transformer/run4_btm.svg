  <text x="380" y="122" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">w64 · batch 256 · lr 0.0006 · bfloat16 · grad_checkpoint · 5 shards/machine · 1 epoch/shard</text>

  <!-- Machine boxes -->
  <rect x="28"  y="132" width="158" height="72" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
