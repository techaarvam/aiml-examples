<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" font-family="system-ui,sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="760" height="500" fill="#f8fafc"/>

  <!-- Title -->
  <text x="380" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Run 4 — BTM Round 2 · OpenWebText · tiktoken cl100k_base · 128M params</text>

  <!-- Data box -->
  <rect x="60" y="38" width="640" height="50" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="380" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a5f">OpenWebText · ~38 GB · 20 shards × 1.9 GB each</text>
  <text x="380" y="78" text-anchor="middle" fill="#374151">capped to 20M tokens / shard · 400M tokens total · steps/shard ≈ 78K</text>

  <!-- Arrow down -->
