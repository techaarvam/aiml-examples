  <text x="279" y="170" text-anchor="middle" fill="#374151">gs6 – gs10</text>
  <text x="279" y="186" text-anchor="middle" fill="#374151">100M tokens</text>
  <text x="279" y="199" text-anchor="middle" font-size="10" fill="#6b7280">~390K steps</text>

  <rect x="372" y="132" width="158" height="72" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
