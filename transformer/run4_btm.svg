  <text x="451" y="170" text-anchor="middle" fill="#374151">gs11 – gs15</text>
  <text x="451" y="186" text-anchor="middle" fill="#374151">100M tokens</text>
  <text x="451" y="199" text-anchor="middle" font-size="10" fill="#6b7280">~390K steps</text>

  <rect x="544" y="132" width="158" height="72" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="623" y="152" text-anchor="middle" font-weight="600" fill="#166534">Machine 4</text>
  <text x="623" y="170" text-anchor="middle" fill="#374151">gs16 – gs20</text>
  <text x="623" y="186" text-anchor="middle" fill="#374151">100M tokens</text>
  <text x="623" y="199" text-anchor="middle" font-size="10" fill="#6b7280">~390K steps</text>

  <!-- Converge lines -->
  <line x1="107" y1="204" x2="350" y2="268" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 2"/>
  <line x1="279" y1="204" x2="360" y2="268" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 2"/>
  <line x1="451" y1="204" x2="400" y2="268" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 2"/>
  <line x1="623" y1="204" x2="410" y2="268" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 2"/>

