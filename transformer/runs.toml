num_heads         = 4
num_layers        = 8
window_size       = 256
batch_size        = 512
epochs            = 32
lr                = 0.0003
lr_schedule       = "none"
float_type        = "bfloat16"
grad_checkpoint   = false
max_tokens        = 20000000
tiktoken_encoding = "gpt2"
input_list        = "raw_data/btm_machines/machine3/input_list.json"

