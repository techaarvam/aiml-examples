# --------------------------------------------------
# Tech Aarvam — Training Run Profiles
# Usage: python runner.py runs.toml <profile>
#        python runner.py runs.toml smoke
#        python runner.py runs.toml mid
#        python runner.py runs.toml server
#
# [defaults] applies to all profiles unless overridden.
# --------------------------------------------------

[defaults]
seed            = 42
optimizer       = "adam"
float_type      = "float32"
qkv             = "fused"
output_type     = "indices"
embedding_type  = "learned"
verbosity       = 1
output_size     = 50
lr_schedule     = "plateau"
use_custom_norm = false
quantize        = false

# ── Smoke: 5 epochs, tiny model, small dataset ────
# Purpose: verify code runs end-to-end in a few minutes
[smoke]
input          = "raw_data/combined.txt"
vecDims        = 32
num_heads      = 2
num_layers     = 2
window_size    = 16
batch_size     = 8192
epochs         = 5
lr             = 0.001
lr_schedule    = "none"

# ── Mid: 10 epochs on combined.txt ────────────────
# Purpose: local iteration, fast feedback on architecture
[mid]
input          = "raw_data/combined.txt"
vecDims        = 64
num_heads      = 2
num_layers     = 3
window_size    = 32 
batch_size     = 1536
epochs         = 10
lr             = 0.0003

# ── High: local RTX 5070 run on WikiText-103 ─────────
# Purpose: meaningful local training — full wiki corpus, float16, ~2.8 hrs/epoch
# Expected: ~4 nights (8 hrs/night) for 10 epochs
[high]
input          = "raw_data/wikitext103.txt"
vecDims        = 512
num_heads      = 8
num_layers     = 8
window_size    = 128
batch_size     = 512
epochs         = 100
lr             = 0.001
float_type     = "bfloat16"

# ── Server: full cloud run on WikiText-103 ─────────
# Purpose: real training run on cloud GPU (A100 / 4090)
[server]
input          = "raw_data/wikitext103.txt"
vecDims        = 512
num_heads      = 8
num_layers     = 12
window_size    = 512
batch_size     = 64
epochs         = 100
lr             = 0.0003
float_type     = "bfloat16"
cache_file     = "raw_data/wikitext103.cache"

# ── BTM Round 2: w64 · 4 machines · tiktoken gpt2 · ~32M params ─────
# Prep:  python raw_data/prepare_btm.py
# Train: bash raw_data/btm_machines/machineN/cmd_run.sh  (one per machine)
# Merge: python merge_checkpoints.py btm_merged.pth runs/btm_w64_*/model.pth
[btm_w64]
_desc             = "BTM round 2 · w64 · gpt2 50k vocab · ~32M params · 5 epochs/machine"
vecDims           = 256
num_heads         = 4
num_layers        = 8
window_size       = 64
batch_size        = 256
epochs            = 20
lr                = 0.0003
float_type        = "bfloat16"
grad_checkpoint   = false
max_tokens        = 20000000
tiktoken_encoding = "gpt2"

# ── BTM Round 2: w128 extension · 1 epoch · from model_step1_128.pth ─────
# Merge: python merge_checkpoints.py btm_w128_merged.pth btm_r2_backups/model_step1_128_m*.pth
[btm_w128]
_desc             = "BTM round 2 · w128 extension · 1 epoch · fresh optimizer from model_step1_128.pth"
vecDims           = 256
num_heads         = 4
num_layers        = 8
window_size       = 128
batch_size        = 256
epochs            = 1
lr                = 0.0003
float_type        = "bfloat16"
grad_checkpoint   = false
max_tokens        = 20000000
tiktoken_encoding = "gpt2"

# ── BTM w128 post-merge continuation · --start_epoch 11 · slice 2 (offset 40M) ─────
[btm_w128_cont]
_desc             = "BTM round 2 · w128 post-merge continuation · start_epoch 11 · slice 2 · fresh data"
vecDims           = 256
num_heads         = 4
num_layers        = 8
window_size       = 128
batch_size        = 256
epochs            = 15
lr                = 0.0003
float_type        = "bfloat16"
grad_checkpoint   = false
max_tokens        = 20000000
tiktoken_encoding = "gpt2"

# ── BTM w256 continuation · --start_epoch 13 · from btm_w256_ext.pth ─────
[btm_w256_cont]
_desc             = "BTM round 2 · w256 extension from btm_w256_ext.pth · start_epoch 13 · slice 2"
vecDims           = 256
num_heads         = 4
num_layers        = 8
window_size       = 256
batch_size        = 160
epochs            = 15
lr                = 0.0003
float_type        = "bfloat16"
grad_checkpoint   = true
max_tokens        = 20000000
tiktoken_encoding = "gpt2"

# ── BTM d384 continuation · --start_epoch 14 · inner_dims 256→384 expansion ─────
# Start: model_d384.pth (32M→40M params, warm-start identity, from btm_w256_cont_ep13.pth ep13)
[btm_d384_cont]
_desc             = "BTM round 2 · w256 · inner_dims 384 expansion · start_epoch 14 · from model_d384.pth"
vecDims           = 256
inner_dims        = 384
num_heads         = 4
num_layers        = 8
window_size       = 256
batch_size        = 160
epochs            = 30
lr                = 0.0003
float_type        = "bfloat16"
grad_checkpoint   = true
max_tokens        = 20000000
tiktoken_encoding = "gpt2"

# ── BTM d512 continuation · --start_epoch 15 · inner_dims 384→512 expansion ─────
# Start: model_d512.pth (40M→51M params, warm-start identity, from btm_d384_cont ep14)
[btm_d512_cont]
_desc             = "BTM round 2 · w256 · inner_dims 512 expansion · start_epoch 15 · from model_d512.pth"
vecDims           = 256
inner_dims        = 512
num_heads         = 4
num_layers        = 8
window_size       = 256
batch_size        = 1024
epochs            = 30
lr                = 0.003
float_type        = "bfloat16"
grad_checkpoint   = true
max_tokens        = 20000000
tiktoken_encoding = "gpt2"

# ── BTM d512 local continuation · start_epoch 16 · RTX 5070 12GB ─────
# Resume from ep15 local backup (loss 5.7338).
# Run: python runner.py runs.toml btm_d512_cont_local \
#          --resume --start_epoch 16 \
#          --model_file btm_r2_backups/d512_20260522/btm_d512_cont_20260522_203334/model.pth
[btm_d512_cont_local]
_desc             = "BTM round 2 · d512 local cont · ep16+ · RTX 5070 12GB · from ep15 backup"
vecDims           = 256
inner_dims        = 512
num_heads         = 4
num_layers        = 8
window_size       = 256
batch_size        = 512
epochs            = 30
lr                = 0.0009
float_type        = "bfloat16"
grad_checkpoint   = true
max_tokens        = 20000000
tiktoken_encoding = "gpt2"
input_list        = "raw_data/btm_machines/machine3/input_list.json"
