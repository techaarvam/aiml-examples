<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transformer LM — Tech Aarvam</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #1a1a1a; color: #e0e0e0; padding: 32px 24px; max-width: 860px; margin: 0 auto; }
  h1 { color: #4fc3f7; font-size: 1.3em; margin-bottom: 4px; }
  .subtitle { color: #666; font-size: 0.8em; margin-bottom: 24px; }
  #model-status { font-size: 0.82em; color: #888; margin-bottom: 20px; padding: 8px 12px; background: #222; border-left: 3px solid #4fc3f7; }
  label { font-size: 0.78em; color: #888; display: block; margin-bottom: 6px; }
  textarea {
    width: 100%; height: 90px; background: #252525; color: #e0e0e0;
    border: 1px solid #3a3a3a; padding: 10px; font-family: monospace;
    font-size: 13px; resize: vertical; outline: none;
  }
  textarea:focus { border-color: #4fc3f7; }
  .controls { display: flex; gap: 16px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  button {
    background: #4fc3f7; color: #000; border: none; padding: 8px 22px;
    cursor: pointer; font-size: 13px; font-family: monospace; font-weight: bold;
  }
  button:disabled { background: #333; color: #555; cursor: not-allowed; }
  button:hover:not(:disabled) { background: #81d4fa; }
  .ctrl-group { display: flex; align-items: center; gap: 6px; font-size: 0.78em; color: #888; }
  input[type=number] {
    width: 64px; background: #252525; color: #e0e0e0;
    border: 1px solid #3a3a3a; padding: 4px 6px; font-family: monospace; font-size: 13px;
  }
  select {
    background: #252525; color: #e0e0e0; border: 1px solid #3a3a3a;
    padding: 4px 6px; font-family: monospace; font-size: 13px;
  }
  #token-count { font-size: 0.75em; color: #555; }
  #status { font-size: 0.78em; color: #666; margin-top: 10px; min-height: 18px; }
  #output {
    margin-top: 16px; padding: 14px; background: #252525;
    border: 1px solid #3a3a3a; min-height: 120px; line-height: 1.8;
    font-size: 13px; white-space: pre-wrap; overflow-y: auto; max-height: 400px;
  }
  .seed { color: #9e9e9e; }
  .generated { color: #81c784; }
  #progress { height: 2px; background: #333; margin-top: 10px; }
  #progress-bar { height: 100%; background: #4fc3f7; width: 0%; transition: width 0.1s; }
</style>
</head>
<body>

<h1>Transformer Language Model</h1>
<div class="subtitle">Tech Aarvam · 11M params · WikiText-103 · 30K vocab</div>

<div id="model-status">Initialising...</div>

<label>Seed text (up to 63 tokens) — grey text is your input, green is generated:</label>
<textarea id="seed-input" placeholder="Enter seed text here..." disabled></textarea>

<div class="controls">
  <button id="generate-btn" disabled onclick="generate()">Generate</button>
  <div class="ctrl-group">
    Output tokens:
    <input type="number" id="output-tokens" value="63" min="1" max="300">
  </div>
  <div class="ctrl-group">
    Sampler:
    <select id="sampler-select" onchange="updateSamplerUI()">
      <option value="min_p" selected>min-p</option>
      <option value="top_k">top-k</option>
      <option value="top_p">top-p</option>
    </select>
  </div>
  <div class="ctrl-group">
    Temp:
    <input type="number" id="temperature" value="1.0" min="0.1" max="3.0" step="0.05" style="width:52px">
  </div>
  <div class="ctrl-group" id="param-min-p">
    min-p:
    <input type="number" id="min-p-val" value="0.05" min="0.01" max="0.5" step="0.01" style="width:52px">
  </div>
  <div class="ctrl-group" id="param-top-k" style="display:none">
    k:
    <input type="number" id="top-k-val" value="50" min="1" max="200">
  </div>
  <div class="ctrl-group" id="param-top-p" style="display:none">
    p:
    <input type="number" id="top-p-val" value="0.9" min="0.1" max="1.0" step="0.05" style="width:52px">
  </div>
  <span id="token-count"></span>
</div>

<div id="status"></div>
<div id="progress"><div id="progress-bar"></div></div>
<div id="output"></div>

<script>
  let session = null;
  let vocab = null;
  let reverseVocab = null;
  let vocabSize = 0;

  function updateSamplerUI() {
    const s = document.getElementById('sampler-select').value;
    document.getElementById('param-min-p').style.display = s === 'min_p' ? '' : 'none';
    document.getElementById('param-top-k').style.display = s === 'top_k' ? '' : 'none';
    document.getElementById('param-top-p').style.display = s === 'top_p' ? '' : 'none';
  }

  function sampleToken(logits, base, unkIdx) {
    const sampler  = document.getElementById('sampler-select').value;
    const temp     = parseFloat(document.getElementById('temperature').value) || 1.0;

    // collect (logit/temp, index) excluding unk
    const pairs = [];
    for (let i = 0; i < vocabSize; i++) {
      if (i === unkIdx) continue;
      pairs.push([logits[base + i] / temp, i]);
    }
    pairs.sort((a, b) => b[0] - a[0]);

    // softmax
    const maxL = pairs[0][0];
    const exps = pairs.map(([v]) => Math.exp(v - maxL));
    const expSum = exps.reduce((a, b) => a + b, 0);
    const probs = exps.map(e => e / expSum);   // parallel to sorted pairs

    let filtered;  // array of [prob, vocabIdx]

    if (sampler === 'top_k') {
      const k = parseInt(document.getElementById('top-k-val').value) || 50;
      filtered = probs.slice(0, k).map((p, i) => [p, pairs[i][1]]);
    } else if (sampler === 'top_p') {
      const p = parseFloat(document.getElementById('top-p-val').value) || 0.9;
      filtered = [];
      let cumul = 0;
      for (let i = 0; i < probs.length; i++) {
        filtered.push([probs[i], pairs[i][1]]);
        cumul += probs[i];
        if (cumul >= p) break;
      }
    } else {  // min_p
      const minP = parseFloat(document.getElementById('min-p-val').value) || 0.05;
      const threshold = minP * probs[0];
      filtered = probs.map((p, i) => [p, pairs[i][1]]).filter(([p]) => p >= threshold);
    }

    // renormalise and sample
    const filtSum = filtered.reduce((a, [p]) => a + p, 0);
    let r = Math.random() * filtSum, cumul = 0;
    for (const [p, idx] of filtered) {
      cumul += p;
      if (r <= cumul) return idx;
    }
    return filtered[0][1];
  }

  // Approximate NLTK word_tokenize behaviour
  function tokenize(text) {
    text = text.toLowerCase();
    text = text.replace(/n't/g, " n't");
    text = text.replace(/'s\b/g, " 's");
    text = text.replace(/'re\b/g, " 're");
    text = text.replace(/'ve\b/g, " 've");
    text = text.replace(/'ll\b/g, " 'll");
    text = text.replace(/'d\b/g, " 'd");
    text = text.replace(/'m\b/g, " 'm");
    text = text.replace(/``/g, ' `` ');
    text = text.replace(/''/g, " '' ");
    text = text.replace(/([.,!?;:()\[\]{}"'])/g, ' $1 ');
    return text.split(/\s+/).filter(t => t.length > 0);
  }

  document.getElementById('seed-input').addEventListener('input', function () {
    const n = Math.min(tokenize(this.value).length, 63);
    document.getElementById('token-count').textContent = `${n}/63 tokens`;
  });

  async function init() {
    const statusEl = document.getElementById('model-status');
    try {
      ort.env.wasm.numThreads = 1;

      statusEl.textContent = 'Loading vocabulary (vocab.json)...';
      const vocabResp = await fetch('vocab.json');
      if (!vocabResp.ok) throw new Error('vocab.json not found — run the web server from the transformer directory');
      vocab = await vocabResp.json();
      vocabSize = Object.keys(vocab).length;
      reverseVocab = Object.fromEntries(Object.entries(vocab).map(([w, i]) => [i, w]));

      statusEl.textContent = `Vocabulary loaded (${vocabSize.toLocaleString()} words). Loading ONNX model (~42 MB)...`;
      session = await ort.InferenceSession.create('transformer_model.onnx', {
        executionProviders: ['wasm']
      });

      statusEl.textContent = `Ready — vocab: ${vocabSize.toLocaleString()} · input: [1,63] int64 · output: [1,63,${vocabSize.toLocaleString()}]`;
      document.getElementById('seed-input').disabled = false;
      document.getElementById('generate-btn').disabled = false;

    } catch (e) {
      statusEl.style.borderColor = '#e57373';
      statusEl.textContent = `Error: ${e.message}`;
      console.error(e);
    }
  }

  async function generate() {
    const seedText = document.getElementById('seed-input').value.trim();
    if (!seedText) return;

    const outputTokens = parseInt(document.getElementById('output-tokens').value) || 63;
    const btn = document.getElementById('generate-btn');
    const statusEl = document.getElementById('status');
    const outputDiv = document.getElementById('output');
    const progressBar = document.getElementById('progress-bar');

    btn.disabled = true;
    progressBar.style.width = '0%';

    const tokens = tokenize(seedText).slice(0, 63);
    const seqLen = 63;

    // Left-pad with 0 (unk) so seed tokens are right-aligned
    let inputIds = new Array(seqLen).fill(0);
    const offset = seqLen - tokens.length;
    for (let i = 0; i < tokens.length; i++) {
      inputIds[offset + i] = vocab[tokens[i]] !== undefined ? vocab[tokens[i]] : 0;
    }

    const generated = [];
    outputDiv.innerHTML = `<span class="seed">${tokens.join(' ')}</span> `;

    for (let step = 0; step < outputTokens; step++) {
      statusEl.textContent = `Generating token ${step + 1} / ${outputTokens}`;
      progressBar.style.width = `${((step + 1) / outputTokens * 100).toFixed(1)}%`;

      // Yield to browser to repaint
      await new Promise(r => setTimeout(r, 0));

      const inputTensor = new ort.Tensor(
        'int64',
        BigInt64Array.from(inputIds.map(BigInt)),
        [1, seqLen]
      );

      const results = await session.run({ input: inputTensor });
      const logits = results.logits.data; // Float32Array [1 * 63 * vocabSize]

      const base   = (seqLen - 1) * vocabSize;
      const unkIdx = vocab['<unk>'] !== undefined ? vocab['<unk>'] : -1;
      const maxIdx = sampleToken(logits, base, unkIdx);

      const nextWord = reverseVocab[maxIdx] || '<unk>';
      generated.push(nextWord);

      outputDiv.innerHTML =
        `<span class="seed">${tokens.join(' ')}</span> <span class="generated">${generated.join(' ')}</span>`;
      outputDiv.scrollTop = outputDiv.scrollHeight;

      // Slide window
      inputIds = [...inputIds.slice(1), maxIdx];
    }

    statusEl.textContent = `Done — ${outputTokens} tokens generated.`;
    progressBar.style.width = '100%';
    btn.disabled = false;
  }

  init();
</script>
</body>
</html>
